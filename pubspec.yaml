name: reviveecotech_rider
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.0

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.7

  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.2

  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1

  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/lang/

  fonts:
    - family: RedHatDisplay
      fonts:
        - asset: fonts/RedHatDisplay-Light.ttf
          weight: 300

        - asset: fonts/RedHatDisplay-Regular.ttf
          weight: 400

        - asset: fonts/RedHatDisplay-Medium.ttf
          weight: 500

        - asset: fonts/RedHatDisplay-SemiBold.ttf
          weight: 600

        - asset: fonts/RedHatDisplay-Bold.ttf
          weight: 700

        - asset: fonts/RedHatDisplay-ExtraBold.ttf
          weight: 800

        - asset: fonts/RedHatDisplay-Black.ttf
          weight: 900